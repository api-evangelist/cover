name: Cover
description: >-
  Cover (Cover Technologies Inc.) is a Los Angeles-based construction technology company that
  designs and builds custom, architect-grade backyard homes, accessory dwelling units (ADUs), and
  residential spaces using a prefabricated, factory-manufactured building system. Cover handles the
  full development process end to end, from initial consultation and design through permitting,
  manufacturing, and on-site installation, delivering custom spaces in weeks rather than years.
  The company is a venture-backed portfolio company of General Catalyst. Cover is a physical-product
  homebuilder and does not currently publish a public developer API, OpenAPI specification, SDKs, or
  developer documentation; this profile captures verifiable company identity and domain-security
  posture for the API Evangelist network.
